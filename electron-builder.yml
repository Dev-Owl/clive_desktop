appId: de.devowl.clive-desktop
productName: CliveEdit Desktop
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# Release assets get predictable names without spaces,
# e.g. clive-desktop-0.1.0-mac-arm64.dmg
artifactName: clive-desktop-${version}-${os}-${arch}.${ext}
# Releases are created by the GitHub Actions workflow, not electron-builder.
publish: null
fileAssociations:
  - ext: [md, markdown]
    name: Markdown Document
    role: Editor
mac:
  category: public.app-category.productivity
  # Ad-hoc signature ("-"): no Apple Developer account needed. Without a valid
  # signature macOS reports downloaded apps as "damaged"; ad-hoc signed apps
  # can be opened via System Settings → Privacy & Security → Open Anyway.
  # Replace with a Developer ID identity (plus notarization) to remove the
  # warning entirely.
  identity: '-'
  # Hardened runtime is only needed for notarization and breaks ad-hoc
  # signed Electron apps (library validation). Enable it with a real identity.
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: Christian <christian.muehle@devowl.de>
  category: Office
