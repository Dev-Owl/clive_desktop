appId: de.devowl.clive-desktop
productName: CliveEdit Desktop
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
fileAssociations:
  - ext: [md, markdown]
    name: Markdown Document
    role: Editor
mac:
  category: public.app-category.productivity
  target: [dmg, zip]
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Office
